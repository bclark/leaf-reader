<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaf Architecture · Cross-Platform Android &amp; iOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #FBF8F2;   /* warm comic paper */
      --color-paper-2:     #F3ECE2;   /* card background */
      --color-ink:         #1A2820;   /* deep forest ink */
      --color-ink-strong:  #0D1611;   /* high contrast text */
      --color-muted:       #4A5D52;   /* sage slate */
      --color-soft:        #687C71;   /* boundary labels */
      --color-accent:      #C46516;   /* leaf ochre focal */
      --color-accent-tint: rgba(196, 101, 22, 0.08);
      --color-link:        #2A5C7A;   /* deep slate blue */
      --font-sans:         'Geist', system-ui, sans-serif;
      --font-serif:        'Instrument Serif', Georgia, serif;
      --font-mono:         'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }

    .frame {
      max-width: 1200px;
      width: 100%;
    }

    .diagram-container {
      width: 100%;
      overflow-x: auto;
      background: var(--color-paper);
      border: 1px solid rgba(26, 40, 32, 0.12);
      border-radius: 8px;
      padding: 1.5rem 1rem;
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.5vw + 1rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.25rem;
    }

    svg {
      width: 100%;
      min-width: 1080px;
      display: block;
    }

    @media print {
      .diagram-container { overflow-x: visible; border: none; padding: 0; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Leaf App Architecture: Android, iOS, &amp; Shared Engine</h1>

    <div class="diagram-container">

        <!-- Background -->

        <text x="600" y="65" fill="#687C71" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ANDROID PLATFORM · COMPOSE &amp; SKIA</text>

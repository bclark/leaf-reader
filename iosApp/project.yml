# XcodeGen spec for the Leaf iOS app. The Xcode project is generated, not committed:
#   xcodegen generate --spec iosApp/project.yml --project iosApp
# The Kotlin :shared framework is built by a pre-build script phase (and explicitly in CI), so
# opening the generated project in Xcode "just works" as long as a JDK is on PATH.
name: Leaf
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
options:
  bundleIdPrefix: com.chakra
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    # App Store versioning: CI overrides these per release (see release-ios workflow); the
    # defaults keep local archives valid. CURRENT_PROJECT_VERSION must increase monotonically
    # per App Store Connect upload.
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    # Automatic signing. Set your Apple Developer Team ID in Local.xcconfig (or override with
    # xcodebuild DEVELOPMENT_TEAM=XXXXXXXXXX for CI/App Store archives).
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    exactVersion: "4.0.3"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  # FOSS RAR5 reader: libarchive's BSD-licensed C library as a prebuilt xcframework. We depend on
  # the raw `libarchive` C product (not the package's Swift wrapper, whose writer fails Swift 6
  # strict-concurrency checks on current toolchains) and read it via a small C-API wrapper — we
  # only need to read CBR/RAR and repackage as CBZ.
  SwiftArchive:
    url: https://github.com/matteo-pacini/libarchive-for-swift
    exactVersion: "1.0.0"

targets:
  Leaf:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: AMSMB2
        embed: true
        codeSign: true
      - package: ZIPFoundation
      - package: SwiftArchive
        product: libarchive
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Leaf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # SMB adds native cryptographic code. Leave export classification to the
        # App Store questionnaire until the dependency review is recorded.
        NSLocalNetworkUsageDescription: "Leaf connects to your SMB drive to browse and import comics you choose."
        UILaunchScreen: {}
        UIAppFonts:
          - Anton-Regular.ttf
          - Archivo-Variable.ttf
        # Landscape matters for a comic reader (wide panels/spreads); iPad must support all
        # orientations for App Store review.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.chakra.comicreader.cbz
              - com.chakra.comicreader.cbr
              - public.zip-archive
              - com.adobe.pdf
        # Exported (not Imported): the app OWNS these types, so the system knows .cbz is a zip and
        # .cbr a data file — otherwise the file importer greys these files out as unselectable.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.chakra.comicreader.cbz
            UTTypeDescription: Comic Book ZIP Archive
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
          - UTTypeIdentifier: com.chakra.comicreader.cbr
            UTTypeDescription: Comic Book RAR Archive
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        TARGETED_DEVICE_FAMILY: "1,2"
        # $(inherited) keeps the values CocoaPods injects via its xcconfig (needed to link
        # TensorFlowLite) alongside our Kotlin-framework search path / link flag.
        # Both SDK variants are conditional — an unconditional device path would also be passed to
        # simulator links, and ld picks whichever framework it finds first once both have been
        # built locally.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "LeafShared"
    preBuildScripts:
      - name: Build Kotlin shared framework
        script: |
          cd "$SRCROOT/.."
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64
          else
            ./gradlew :shared:linkReleaseFrameworkIosArm64
          fi
        basedOnDependencyAnalysis: false

  LeafTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Leaf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "LeafShared"

schemes:
  Leaf:
    build:
      targets:
        Leaf: all
        LeafTests: [test]
    test:
      targets:
        - LeafTests
    run:
      config: Debug
    archive:
      config: Release

name: Release

# Push a v* tag to publish Android release artifacts and reader-friendly notes.
# Artifacts are signed only when the repository signing secrets are configured.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ steps.ver.outputs.name }}"
          if ! grep -q "versionName = \"$TAG_VERSION\"" app/build.gradle.kts; then
            echo "Error: Tag version '$TAG_VERSION' does not match versionName in app/build.gradle.kts"
            exit 1
          fi

      - name: Verify reader-friendly release notes exist
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build full release and F-Droid release artifacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # Build full bundle (AAB) and APK (signed if keystore secret present, otherwise unsigned)
          ./gradlew :app:bundleFullRelease :app:assembleFullRelease --stacktrace
          # Build unsigned F-Droid release APK for F-Droid server signing
          ./gradlew :app:assembleFdroidRelease --stacktrace

      # R8 is enabled, so keep the deobfuscation maps with every release — crash
      # reports (and any bug report against this build) are unreadable without it.
      - name: Package R8 mappings
        run: |
          if [ -f app/build/outputs/mapping/fullRelease/mapping.txt ]; then
            cp app/build/outputs/mapping/fullRelease/mapping.txt "mapping-full-${{ steps.ver.outputs.name }}.txt"
          fi
          if [ -f app/build/outputs/mapping/fdroidRelease/mapping.txt ]; then
            cp app/build/outputs/mapping/fdroidRelease/mapping.txt "mapping-fdroid-${{ steps.ver.outputs.name }}.txt"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Leaf ${{ steps.ver.outputs.name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          # Tags with a suffix (e.g. v0.2.0-beta, v1.0.0-rc1) publish as a GitHub pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/bundle/fullRelease/*.aab
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/fdroid/release/*.apk
            mapping-*.txt
